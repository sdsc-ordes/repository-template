name: normal
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [generic, python, go, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-nix
        with:
          cachix_cache_name: "${{ secrets.CACHIX_CACHE_NAME }}"
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Build & Test: ${{ matrix.language }}"
        run: just ci just maintenance::test ${{ matrix.language }}

  test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-nix
        with:
          cachix_cache_name: "${{ secrets.CACHIX_CACHE_NAME }}"
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Build & Test Images"
        run: just ci just maintenance::test-image

  deploy-image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs:
      - test-templates

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-nix
        with:
          cachix_cache_name: "${{ secrets.CACHIX_CACHE_NAME }}"
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Deploy 'latest' Image"
        env:
          REGISTRY_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REGISTRY_USERNAME: "${{ github.actor }}"
        run: just ci just maintenance::push-deploy-image

      - name: "Deploy Versioned Image"
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REGISTRY_USERNAME: "${{ github.actor }}"
        run: just ci just maintenance::push-deploy-image "${GITHUB_REF_NAME#v*}"
